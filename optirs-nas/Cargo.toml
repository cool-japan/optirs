[package]
name = "optirs-nas"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "OptiRS Neural Architecture Search and hyperparameter optimization"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["nas", "neural-architecture", "hyperparameter", "bayesian", "evolutionary"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core dependencies
#
# NOTE: `optirs-core` and `optirs-learned` were declared here but never used
# (no `optirs_core::` / `optirs_learned::` path appears anywhere in this
# crate). `optirs-learned` was pulled in only by the `learned_integration`
# feature, which had no module behind it. Both are removed so `optirs-nas`
# builds and tests standalone; the benchmark harness in `evaluation::benchmark`
# implements its optimizer update rules directly, which also makes NAS scores
# reproducible independently of sibling-crate changes.
#
# The `random` feature is declared explicitly rather than relied upon through
# feature unification with a sibling crate: every search strategy samples from
# `scirs2_core::random`, so this crate must request it itself.
scirs2-core = { workspace = true, features = ["random"] }  # SciRS2 policy compliance

# ❌ FORBIDDEN DEPENDENCIES REMOVED - Use SciRS2-Core abstractions instead
# ndarray - Use scirs2_core::ndarray
# num-traits - Use scirs2_core::numeric

thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
log = { workspace = true }

# Random generation and distributions - REMOVED: Use scirs2_core::random instead
# rand = { workspace = true }
# rand_distr = { workspace = true }

# Optimization and search
rustc-hash = { workspace = true }
smallvec = { workspace = true }

# System information
num_cpus = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

# Async support
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
approx = { workspace = true }
tempfile = { workspace = true }

[features]
# The default build enables every search strategy. Individual strategies can be
# switched off by using `--no-default-features` and re-enabling only what is
# needed; each flag gates the corresponding module in `search_strategies`.
default = ["bayesian", "evolutionary", "reinforcement", "progressive", "multi_objective"]

# Bayesian optimization with a Gaussian-process surrogate.
bayesian = []
# Population-based evolutionary architecture search.
evolutionary = []
# Reinforcement-learning controller (LSTM + REINFORCE).
reinforcement = []
# Progressive (staged complexity) search.
progressive = []
# Multi-objective search (NSGA-II and friends).
multi_objective = []