[workspace]
members = [
    "optirs",
    "optirs-core",
    "optirs-gpu",
    "optirs-tpu",
    "optirs-learned",
    "optirs-nas",
    "optirs-bench",
    "optirs-wasm",
]
resolver = "2"

[workspace.lints.rust]
unused_variables = "allow"
unused_imports = "allow"
mismatched_lifetime_syntaxes = "allow"
dead_code = "allow"
unpredictable_function_pointer_comparisons = "allow"
unknown_lints = "allow"

[workspace.package]
version = "0.3.2"
edition = "2021"
authors = ["COOLJAPAN OU (Team KitaSan)"]
description = "Advanced ML optimization and hardware acceleration library"
license = "Apache-2.0"
repository = "https://github.com/cool-japan/optirs"
keywords = ["optimization", "machine-learning", "gpu", "tpu", "neural-architecture"]
categories = ["science", "mathematics", "algorithms", "development-tools"]

[workspace.dependencies]
# Core array computing - REMOVED: Use scirs2_core::ndarray_ext instead
# ndarray = { version = "0.16.1", default-features = false, features = ["std", "serde", "rayon"] }
# ndarray-stats = "0.6.0"
# ndarray-rand = "0.15.0"

# 🚨 FORBIDDEN DEPENDENCIES REMOVED - Use SciRS2-Core abstractions instead
# num-traits - Use scirs2_core::numeric
# num-complex - Use scirs2_core::numeric
# num-integer - Use scirs2_core::numeric
# rayon - Use scirs2_core::parallel_ops
# wide - Use scirs2_core::simd_ops
# rand, rand_distr, rand_core - Use scirs2_core::random
# fastrand - Use scirs2_core::random
# ndarray, ndarray-stats, ndarray-rand - Use scirs2_core::ndarray

# System utilities (allowed - not scientific computing)
num_cpus = "1.17.0"

# Development and testing
thiserror = "2.0.18"
anyhow = "1.0"
approx = "0.5.1"
criterion = "0.8.2"
tempfile = "3.27.0"
tokio-test = "0.4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4.45"

# GPU backends - cross-platform only
cudarc = { version = "0.19", features = ["cuda-12000"] }
opencl3 = { version = "0.12" }
wgpu = { version = "29.0" }
pollster = { version = "0.4" }

# ML specific
smallvec = "1.15.2"
uuid = { version = "1.23.4", features = ["v4"] }
rustc-hash = "2.1.2"

# System information
sysinfo = "0.39.5"

# Async dependencies
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.34"
toml = "1.1.4"
async-trait = "0.1.89"

# Logging
log = "0.4"

# Utilities
sha2 = "0.11"
md5 = "0.8.0"
clap = { version = "4.6", features = ["derive"] }

# Cryptography
rsa = { version = "0.9" }
x509-parser = { version = "0.18" }
# Pure-Rust X25519 elliptic-curve Diffie-Hellman (curve25519-dalek backend, no C/C++).
# Used by privacy::federated::pairwise_masking to derive the pairwise shared seeds of
# the Bonawitz secure-aggregation protocol, so that the aggregation server -- which
# holds no secret key -- cannot reconstruct any client's mask.
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# OptiRS crates
optirs-core = { version = "0.3.2", path = "./optirs-core" }
optirs-gpu = { version = "0.3.2", path = "./optirs-gpu" }
optirs-tpu = { version = "0.3.2", path = "./optirs-tpu" }
optirs-learned = { version = "0.3.2", path = "./optirs-learned" }
optirs-nas = { version = "0.3.2", path = "./optirs-nas" }
optirs-bench = { version = "0.3.2", path = "./optirs-bench" }

# WASM dependencies
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.103"
web-sys = "0.3"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
wasm-bindgen-test = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
# Force getrandom 0.2 (transitive via rand/statrs/scirs2) to use the js backend on wasm32
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# 🚨 CRITICAL: SciRS2 ECOSYSTEM DEPENDENCIES 🚨
#
# OptiRS MUST use SciRS2 as its scientific computing foundation.
# This section implements minimal dependency policy as per SCIRS2_INTEGRATION_POLICY.md
#
# PHILOSOPHY: OptiRS is an OPTIMIZATION library, not an autodiff framework.
# Start minimal - add dependencies only when compilation errors prove necessity.
#
# ✅ ESSENTIAL (Always Required):
scirs2-core = "0.6.5"# FOUNDATION - Core scientific primitives
scirs2-optimize = "0.6.5"# ESSENTIAL - Base optimization interfaces

# ⚠️ EVIDENCE-BASED (Added because compilation errors prove necessity):
scirs2-neural = "0.6.5"# EVIDENCE: neuromorphic/spike_based.rs requires this
scirs2-metrics = "0.6.5"# EVIDENCE: benchmarking and monitoring require this
scirs2-stats = "0.6.5"# EVIDENCE: multiple modules use distributions
scirs2-datasets = "0.6.5"# EVIDENCE: cross_platform_tester.rs requires this

# ⚠️ CONDITIONAL scirs2-linalg / scirs2-signal removed (Wave 0 pass): zero
# references across all member manifests and source. Re-add to this table
# (and to the consuming crate's [dependencies]) if a future module needs them.

# ❌ NOT REQUIRED for OptiRS:
# scirs2-autograd - OptiRS receives pre-computed gradients, doesn't compute them

[profile.release]
opt-level = 3
lto = false
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0

[profile.bench]
opt-level = 3
